name: Cleanup Devstand Docker Artifacts

on:
  workflow_dispatch:

jobs:
  cleanup_vps:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup devstand containers and dangling images on VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          ssh -i key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            docker compose -f /opt/cash-flow-backend/docker-compose.devstand.yml down --remove-orphans || true &&
            docker image prune -f
          "

          rm key.pem
