name: Build, Push and Deploy

on:
  push:
    branches:
      - master

jobs:
  build_image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cash-flow-backend:latest .

      - name: Save image to archive
        run: |
          docker save ${{ secrets.DOCKER_USERNAME }}/cash-flow-backend:latest | gzip > cash-flow-backend-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cash-flow-backend-image
          path: cash-flow-backend-image.tar.gz
          retention-days: 1

  push_image:
    runs-on: ubuntu-latest
    needs: build_image

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: cash-flow-backend-image

      - name: Load image from archive
        run: |
          gunzip -c cash-flow-backend-image.tar.gz | docker load

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cash-flow-backend:latest

  cleanup:
    runs-on: ubuntu-latest
    needs: push_image

    steps:
      - name: Clean up existing deployment on VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          ssh -i key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /opt/cash-flow &&
            docker compose down --remove-orphans
          "

          rm key.pem

  deploy:
    runs-on: ubuntu-latest
    needs: cleanup

    steps:
      - name: Deploy to VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          ssh -i key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /opt/cash-flow &&
            docker compose pull &&
            docker compose up -d
          "

          rm key.pem
