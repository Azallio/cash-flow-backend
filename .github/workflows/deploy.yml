name: Build, Push and Deploy

on:
  push:
    branches:
      - master

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cash-flow-backend:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cash-flow-backend:latest

  cleanup:
    runs-on: ubuntu-latest
    needs: build_and_push_image

    steps:
      - name: Clean up existing deployment on VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          ssh -i key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /opt/cash-flow &&
            docker compose down --remove-orphans --rmi all &&
            docker image prune -f &&
            docker volume prune -f
          "

          rm key.pem

  deploy:
    runs-on: ubuntu-latest
    needs: cleanup

    steps:
      - name: Deploy to VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

          ssh -i key.pem -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /opt/cash-flow &&
            docker compose pull &&
            docker compose up -d
          "

          rm key.pem
