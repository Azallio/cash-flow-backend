services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: cash-flow-backend-devstand-app
    restart: unless-stopped
    env_file:
      - .development.env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
    ports:
      - '3000:3000'
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - cash-flow-network
  postgres_db:
    image: postgres:16-alpine
    container_name: cash-flow-backend-devstand-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cash_flow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_devstand:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cash_flow_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cash-flow-network

networks:
  cash-flow-network:
    external: true

volumes:
  postgres_data_devstand:
