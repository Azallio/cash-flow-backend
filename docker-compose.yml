services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cash-flow-backend-app
    restart: unless-stopped
    env_file:
      - .development.env
    environment:
      NODE_ENV: development
      DB_HOST: postgres_db
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    command: npm run start:dev
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    image: postgres:16-alpine
    container_name: cash_flow_postgres_container
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cash_flow_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-cash_flow_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
